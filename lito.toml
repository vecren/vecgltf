[package]
name = "vecgltf"
version = "0.1.0"
authors = ["hypengw <hypengwip@gmail.com>"]
license = "MIT OR Apache-2.0"

[lib]
name = "vecgltf"
module = "vecgltf"
archive = "vecgltf"

[profile.base]
exceptions = false
rtti = false

[dependencies]
rstd-std = { version = "0.1.5", pub = true }
vrento = { git = "https://github.com/vecren/vrento.git", pub = true }
lito-spirv = { version = "0.1.0" }

[build-tools.glslang]
path = "glslangValidator"

[dev-dependencies]
rstd-bench = { version = "0.1.5" }
rstd-nostd = { version = "0.1.5", usage = "link" }

[[bench]]
name = "load"
module = "vecgltf.bench.load"
sources = ["benches/load.cppm"]
link-stdlib = false
